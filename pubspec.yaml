    - packages/animated_emoji/lottie/balloon.json
    - packages/animated_emoji/lottie/glowingStar.json
    - packages/animated_emoji/lottie/mindBlown.json
    - packages/animated_emoji/lottie/thinkingFace.json
    - packages/animated_emoji/lottie/sleep.json
