    - packages/animated_emoji/lottie/coldFace.json
    - packages/animated_emoji/lottie/ghost.json
    - packages/animated_emoji/lottie/alien.json
    - packages/animated_emoji/lottie/dog.json
    - packages/animated_emoji/lottie/wave.json
    - packages/animated_emoji/lottie/checkMark.json
    - packages/animated_emoji/lottie/crossMark.json
