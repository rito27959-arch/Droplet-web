name: droplet
description: Droplet — Messagerie et appels en réseau mesh hors ligne (P2P, sans Internet).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_animate: ^4.5.0

  # Localisation — voir `l10n.yaml` et `lib/l10n/app_fr.arb`.
  flutter_localizations:
    sdk: flutter

  # Lecteur Lottie en pur Dart. Il sert ici à afficher les STICKERS
  # ANIMÉS au format `.tgs` de Telegram — qui n'est rien d'autre qu'un
  # JSON Bodymovin/Lottie compressé en gzip, avec un attribut `"tgs": 1`.
  # Le paquet sait le décompresser lui-même (`LottieComposition.decodeGZip`),
  # ce qui évite d'embarquer `rlottie` en natif comme le fait Telegram.
  lottie: ^3.3.3
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.12.0
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^8.0.0
  bluetooth_low_energy: ^6.2.1
  nsd: ^5.0.1
  nearby_service: ^0.2.1
  flutter_webrtc: ^1.5.2
  drift: ^2.23.0
  sqlite3_flutter_libs: ^0.5.0
  sqlite3: ^2.4.0
  # `path` était déjà là par transitivité (drift en dépend), mais
  # `conversations_ia_store.dart` l'importe DIRECTEMENT pour composer le
  # chemin de sa propre base. Une dépendance directe se déclare : le jour
  # où drift change de dépendances, l'assistant ne doit pas casser.
  path: ^1.9.0
  # LA PRODUCTION DE FICHIERS par l'assistant (`production_fichiers.dart`).
  # `archive` sert au zip ET aux .docx/.pptx, qui sont des zip d'XML :
  # aucun paquet Dart ne les écrit correctement, on les compose donc à la
  # main — c'est du texte, et ça évite une dépendance de plus.
  archive: ^3.6.1
  pdf: ^3.11.1
  record: ^6.2.1
  audioplayers: ^6.4.0
  # LA LECTURE À VOIX HAUTE des réponses de l'assistant (« Lire », sous
  # chaque réponse). C'est la synthèse vocale DU SYSTÈME — hors ligne,
  # sans aucun service distant — que ce paquet pilote sur Android et iOS.
  # Côté Android, voir le bloc `<queries>` de AndroidManifest.xml.
  flutter_tts: ^4.2.5
  battery_plus: ^6.2.1
  cryptography: ^2.7.0
  pointycastle: ^4.0.0
  libsignal_protocol_dart: ^0.8.2
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  geolocator: ^13.0.2
  flutter_foreground_task: ^10.0.0
  flutter_local_notifications: ^22.2.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  receive_sharing_intent: 1.8.1
  flutter_ringtone_player: ^4.0.0+4
  permission_handler: 12.0.3
  flutter_shaders: ^0.1.3
  raw_magnifier_plus: ^0.1.1
  video_player: ^2.11.1
  camera: ^0.12.0+2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  http: ^1.6.0
  # Le navigateur intégré (WKWebView sur iPhone).
  webview_flutter: ^4.10.0
  # LECTEUR PDF — rendu natif des documents, sans quitter l'app.
  pdfx: ^2.9.1
  # RÉSEAU TOR — transport chiffré pour communication à distance.
  # Basé sur Arti (Rust), gère un proxy SOCKS5 local sur 127.0.0.1:9050.
  # +50MB APK (Arti/Rust), ~50-100MB RAM
  tor: ^0.1.1
  # LES RESSORTS D'APPLE, À L'IDENTIQUE.
  #
  # iOS n'anime presque rien avec une courbe et une durée : il lance un
  # RESSORT, et laisse la physique décider du reste. La différence se
  # sent surtout quand on interrompt un geste — une courbe repart de
  # zéro, un ressort garde la vitesse en cours et rattrape la nouvelle
  # cible sans à-coup. C'est toute la « fluidité » qu'on cherche.
  #
  # `motor` expose les réglages exacts de SwiftUI (`CupertinoMotion`
  # .smooth / .snappy / .bouncy / .interactive) — pas une imitation
  # approximative. Aucun coût GPU : c'est du calcul de position.
  motor: ^1.1.0
  # LE VRAI VERRE LIQUIDE D'iOS 26 — un shader qui RÉFRACTE le contenu
  # passant dessous, avec reflets spéculaires et liseré lumineux.
  #
  # ⚠️ C'EST CHER, ET C'EST ASSUMÉ. Le paquet est expérimental, exige
  # Impeller, et ses auteurs déconseillent de l'activer aveuglément
  # partout. Droplet l'emploie donc à UN SEUL endroit — la capsule
  # d'onglets, la seule pièce de châssis visible en permanence — et
  # bascule tout seul sur le flou classique (`fake`) quand le téléphone
  # chauffe. Voir `ouro_glass.dart`.
  liquid_glass_renderer: ^0.2.0-dev.4
  animated_emoji: ^3.2.1
  photo_manager: ^3.12.0
  # Compression d'images en pur Dart — pour réduire les photos de statut
  # trop volumineuses (>10 Mo) avant envoi sur le mesh, où la bande
  # passante est comptée (BLE = 19 octets/émission).
  image: ^4.3.0
  # COMPOSANTS UI LIQUIDE GLASS — 52 composants inspirés d'iOS 26 :
  # boutons, champs de texte, cartes, dialogs, indicateurs, etc.
  # Utilisé EN COMPLÉMENT du design system ouro existant (pas en remplacement).
  liquid_glass_ui_design: ^1.0.5
  # VRAI Liquid Glass UIKit natif (iOS 26+) via Platform Views.
  # Utilise UIGlassEffect, UITabBarController, UINavigationBar natifs
  # au lieu du shader Dart. Fallback gracieux sur iOS < 26.
  native_liquid_glass: ^0.2.15
  # Composants adaptatifs natifs iOS 26 : Alert Dialog, Slider, Switch,
  # Segmented Control — tous avec Liquid Glass automatique.
  adaptive_platform_ui: ^0.1.6
  flutter_gemma: ^0.12.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.23.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  # Génère `AppLocalizations` depuis `lib/l10n/app_*.arb`, selon
  # `l10n.yaml`. `flutter gen-l10n` (ou `flutter pub get`) régénère le
  # code après tout changement de fichier .arb.
  generate: true

  # ── LA POLICE, EMBARQUÉE — ET C'EST NON NÉGOCIABLE ──────────────────
  #
  # `google_fonts` TÉLÉCHARGE la police au premier usage, depuis
  # fonts.gstatic.com. Dans une messagerie mesh, c'est-à-dire dans une
  # application dont le scénario NOMINAL est « pas d'Internet », cela
  # voulait dire : premier lancement hors ligne = repli silencieux sur
  # Roboto, et toute l'échelle typographique iOS de `ouro_typography.dart`
  # — le tracking négatif à 17 pt, les hauteurs de ligne calculées, les
  # chiffres tabulaires — disparaissait sans une seule erreur.
  #
  # ⚠️ ET C'ÉTAIT AUSSI UNE FUITE. Une application qui embarque Tor et se
  # présente comme hors-réseau émettait une requête HTTP vers un serveur
  # Google au premier démarrage. Ce n'était pas un défaut de rendu, c'était
  # un défaut de modèle de menace.
  #
  # UN SEUL FICHIER pour toute l'échelle : Inter est une police VARIABLE
  # (axe `wght` de 100 à 900). 788 Ko couvrent les graisses 400/600/700
  # que l'app utilise — moins que ce que `google_fonts` aurait téléchargé
  # en trois fichiers statiques. Voir `OuroTypography._font`, qui pilote
  # l'axe via `FontVariation`.
  #
  # Licence : Inter est publiée sous SIL Open Font License 1.1, qui
  # autorise l'embarquement. L'attribution figure dans « À propos de
  # Droplet » (`settings_screen.dart`), à côté de celle de Noto.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

  # L'icône de l'app, embarquée pour l'écran de démarrage : c'est la même
  # image que celle du lanceur, ce qui fait que l'icône sur laquelle on
  # vient d'appuyer semble se prolonger dans l'app au lieu d'être
  # remplacée par autre chose.
  assets:
    - assets/icon/droplet_icon.png
    # Tonalités de notification (voir assets/sounds/CREDITS.txt et
    # SoundService). Courtes, sobres, niveau normalisé.
    - assets/sounds/
    # Les neuf variantes d'icône, montrées dans la grille de choix des
    # réglages. Elles sont AUSSI déclinées côté Android (voir
    # `tool/build_icon_variants.py`) : ici c'est l'aperçu, là-bas
    # l'icône réelle du lanceur.
    - assets/icon/variants/
    # Icônes premium
    - assets/icon/premuim/


    # ── Les 50 emojis animés de Noto (Google) ────────────────────────
    #
    # Ce sont de vraies animations Lottie, celles qu'on voit dans les
    # applications de Google. Elles viennent du paquet `animated_emoji`,
    # qui en embarque 694 — mais qui n'en DÉCLARE aucune : rien n'entre
    # dans l'APK tant qu'on ne le demande pas ici.
    #
    # ⚠️ D'où cette liste écrite à la main plutôt qu'un
    # `packages/animated_emoji/lottie/` global. Les 694 pèsent 53 Mo. La
    # cinquantaine retenue en pèse 3,2 — et couvre ce qu'on utilise
    # réellement dans une conversation. Pour en ajouter une, prenez son
    # nom dans `~/.pub-cache/hosted/pub.dev/animated_emoji-*/lib/lottie/`.
    #
    # ⚠️ LICENCE : Noto Animated Emoji est publié sous CC BY 4.0, qui
    # EXIGE l'attribution. Elle figure dans « À propos de Droplet »
    # (`settings_screen.dart`). Ne la retirez pas : sans elle, l'usage
    # devient une violation de licence.
    - packages/animated_emoji/lottie/joy.json
    - packages/animated_emoji/lottie/electricity.json
    - packages/animated_emoji/lottie/heartEyes.json
    - packages/animated_emoji/lottie/thumbsUp.json
