    # Les stickers animés (.tgs de Telegram, ou .json Lottie).
    #
    # ⚠️ Ce dossier est VOLONTAIREMENT livré vide, avec pour seul
    # contenu son fichier d'index. Les stickers de Telegram sont leur
    # propriété : les embarquer dans une application publiée serait une
    # contrefaçon. À vous d'y déposer des animations dont vous avez le
    # droit d'usage — voir `assets/stickers/LISEZ-MOI.md`.
    - assets/stickers/
    - assets/lottie/
  # Shaders GLSL compilés à la construction et chargés à l'exécution —
  # voir `lib/design_system/ouro_liquid.dart` pour leur utilisation.
  shaders:
    - shaders/liquid.frag
    - shaders/nexus.frag
    - shaders/fond_prisme.frag
    - shaders/lentille_ios.frag
