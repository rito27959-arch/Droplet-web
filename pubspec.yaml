    - packages/animated_emoji/lottie/cry.json
    - packages/animated_emoji/lottie/loudlyCrying.json
    - packages/animated_emoji/lottie/laughing.json
    - packages/animated_emoji/lottie/grin.json
    - packages/animated_emoji/lottie/wink.json
    - packages/animated_emoji/lottie/blush.json
