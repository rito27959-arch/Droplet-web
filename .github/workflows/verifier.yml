# Vérifie chaque push : analyse et construction web. Le journal de cette
# action est ce qui permet de corriger le code sans machine Flutter.
name: Vérifier

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Analyse
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Construction web
        run: flutter build web --release --no-tree-shake-icons
