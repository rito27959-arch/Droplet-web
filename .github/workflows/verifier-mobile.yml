name: Vérifier l'app mobile
on:
  push:
    branches: [verif-mobile]
permissions:
  contents: write
jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          set +e
          { flutter pub get; echo "pub: $?"; flutter analyze --no-fatal-infos --no-fatal-warnings lib; echo "analyse: $?"; python3 outils/actifs_factices.py; flutter test test/crypto_service_test.dart --reporter expanded; echo "tests crypto: $?"; flutter test test/ouverture_rendu_test.dart --reporter expanded; echo "rendu ouverture: $?"; flutter test test/accueil_rendu_test.dart --reporter expanded; echo "rendu accueil: $?"; flutter test test/sonnerie_rendu_test.dart --reporter expanded; echo "rendu sonnerie: $?"; for t in test/*_rendu2_test.dart; do [ -e "$t" ] && { flutter test "$t" --reporter expanded; echo "rendu $(basename $t): $?"; }; done; AJ=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -1)/android.jar; kotlinc -cp "$AJ" android/app/src/main/kotlin/com/droplet/droplet/LectureVocaleService.kt outils/kotlin_bouchons/*.kt -d /tmp/kt 2>&1 | grep -v "^warning" ; echo "kotlin: ${PIPESTATUS[0]}"; ls /tmp/kt/com/droplet/droplet | head -3; } > journal.txt 2>&1
          cp journal.txt /tmp/j.txt; rm -rf /tmp/rendu /tmp/rendu_accueil; cp -r build/rendu /tmp/rendu 2>/dev/null || true; cp -r build/rendu_accueil /tmp/rendu_accueil 2>/dev/null || true
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan journal-mobile; git rm -rfq . >/dev/null; cp /tmp/j.txt journal.txt
          cp -r /tmp/rendu rendu 2>/dev/null || true; cp -r /tmp/rendu_accueil rendu_accueil 2>/dev/null || true; git add journal.txt; git add rendu rendu_accueil 2>/dev/null; git commit -qm journal; git push -fq origin journal-mobile
