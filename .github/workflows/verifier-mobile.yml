name: Vérifier l'app mobile
on:
  push:
    branches: [verif-mobile]
permissions:
  contents: write
jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          set +e
          { flutter pub get; echo "pub: $?"; flutter analyze --no-fatal-infos --no-fatal-warnings lib; echo "analyse: $?"; } > journal.txt 2>&1
          cp journal.txt /tmp/j.txt
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan journal-mobile; git rm -rfq . >/dev/null; cp /tmp/j.txt journal.txt
          git add journal.txt; git commit -qm journal; git push -fq origin journal-mobile
