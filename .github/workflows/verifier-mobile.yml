name: Vérifier l'app mobile
on:
  push:
    branches: [verif-mobile]
permissions:
  contents: write
jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          set +e
          { flutter pub get; echo "pub: $?"; flutter analyze --no-fatal-infos --no-fatal-warnings lib; echo "analyse: $?"; python3 outils/actifs_factices.py; flutter test test/crypto_service_test.dart --reporter expanded; echo "tests crypto: $?"; flutter test test/liens_droplet_test.dart --reporter expanded; echo "tests liens: $?"; flutter test test/ouverture_rendu_test.dart --reporter expanded; echo "rendu ouverture: $?"; flutter test test/accueil_rendu_test.dart --reporter expanded; echo "rendu accueil: $?"; flutter test test/sonnerie_rendu_test.dart --reporter expanded; echo "rendu sonnerie: $?"; for t in test/*_rendu2_test.dart; do [ -e "$t" ] && { flutter test "$t" --reporter expanded; r=$?; echo "rendu $(basename $t): $r"; }; done; if git log -1 --format=%B | grep -q "export-stickers"; then flutter test test/stickers_export_test.dart; echo "export stickers: $?"; fi; AJ=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -1)/android.jar; kotlinc -cp "$AJ" android/app/src/main/kotlin/com/droplet/droplet/LectureVocaleService.kt android/app/src/main/kotlin/com/droplet/droplet/ProfilAppareil.kt android/app/src/main/kotlin/com/droplet/droplet/FournisseurPartage.kt android/app/src/main/kotlin/com/droplet/droplet/PartageDroplet.kt outils/kotlin_bouchons/*.kt -d /tmp/kt 2>&1 | grep -v "^warning" ; echo "kotlin: ${PIPESTATUS[0]}"; ls /tmp/kt/com/droplet/droplet | head -3; M=https://dl.google.com/android/maven2/androidx; mkdir -p /tmp/ax && (cd /tmp/ax && curl -sSLo core.aar $M/core/core/1.13.1/core-1.13.1.aar && unzip -qo core.aar classes.jar && mv classes.jar core.jar; curl -sSLo annot.jar $M/annotation/annotation-jvm/1.8.0/annotation-jvm-1.8.0.jar; curl -sSLo vp.aar $M/versionedparcelable/versionedparcelable/1.1.1/versionedparcelable-1.1.1.aar && unzip -qo vp.aar classes.jar && mv classes.jar vp.jar; curl -sSLo lc.aar $M/lifecycle/lifecycle-common/2.6.2/lifecycle-common-2.6.2.jar); kotlinc -cp "$AJ:/tmp/ax/core.jar:/tmp/ax/annot.jar:/tmp/ax/vp.jar" android/app/src/main/kotlin/com/droplet/droplet/AppelEnCoursService.kt android/app/src/main/kotlin/com/droplet/droplet/AppelActionReceiver.kt android/app/src/main/kotlin/com/droplet/droplet/AppelNotifPont.kt outils/kotlin_bouchons/*.kt -d /tmp/kt2 2>&1 | grep -v "^warning" ; echo "kotlin appel: ${PIPESTATUS[0]}"; } > journal.txt 2>&1
          cp journal.txt /tmp/j.txt; rm -rf /tmp/rendu /tmp/rendu_accueil /tmp/export_stickers; cp -r build/export_stickers /tmp/export_stickers 2>/dev/null || true; cp -r build/rendu /tmp/rendu 2>/dev/null || true; cp -r build/rendu_accueil /tmp/rendu_accueil 2>/dev/null || true
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan journal-mobile; git rm -rfq . >/dev/null; cp /tmp/j.txt journal.txt
          cp -r /tmp/rendu rendu 2>/dev/null || true; cp -r /tmp/rendu_accueil rendu_accueil 2>/dev/null || true; cp -r /tmp/export_stickers export_stickers 2>/dev/null || true; git add journal.txt; git add export_stickers 2>/dev/null; git add rendu rendu_accueil 2>/dev/null; git commit -qm journal; git push -fq origin journal-mobile
